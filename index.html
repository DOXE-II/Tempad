<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempad</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="boot" class="screen active"> 
        <button id="boot-btn">POWER</button>
    </section>
    <section id="signin" class="screen">
        <h1>SIGN IN</h1>
        <div class="miss-minutes"></div>
        <button class="nav-btn" data-target="actionlist">Enter Agent ID
        <span class="fleche">↳</span>
        </button>
        <p>Property of the Time Variance Authority</p>

    </section>

    <section id="actionlist" class="screen">
        <h1>ACTION LIST</h1>
        <button class="nav-btn" data-target="signin">BACK</button>
    </section>

    <div class="cadre"></div>
    <div class="scanlines"> </div>

    <script src="script.js"></script>
</body>

</html>
